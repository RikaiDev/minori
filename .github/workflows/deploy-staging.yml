name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: validate
    environment: staging
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Triggering Render deployment..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo ""
            echo "✅ Deploy triggered! Render will build and deploy automatically."
          else
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not configured."
            echo ""
            echo "To set up Render deployment:"
            echo "1. Create a Web Service on Render using this repo"
            echo "2. Go to Settings > Deploy Hook"
            echo "3. Copy the deploy hook URL"
            echo "4. Add it as RENDER_DEPLOY_HOOK_URL secret in GitHub"
            exit 1
          fi

  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "🗄️  Running database migrations on Neon..."
            bun run db:migrate
            echo "✅ Database migrations complete!"
          else
            echo "⚠️  DATABASE_URL not set. Skipping migrations."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy, migrate]
    if: success()
    environment: staging
    steps:
      - name: Wait for Render deployment
        run: |
          echo "⏳ Waiting 60s for Render to complete deployment..."
          sleep 60

      - name: Check health endpoint
        run: |
          if [ -n "${{ secrets.STAGING_URL }}" ]; then
            echo "🏥 Checking health at ${{ secrets.STAGING_URL }}/health..."

            # Retry up to 5 times (Render free tier can be slow to wake)
            for i in 1 2 3 4 5; do
              if curl -sf "${{ secrets.STAGING_URL }}/health" > /dev/null; then
                echo "✅ Health check passed!"
                curl -s "${{ secrets.STAGING_URL }}/health" | head -c 500
                exit 0
              fi
              echo "Attempt $i failed, retrying in 15s..."
              sleep 15
            done

            echo "❌ Health check failed after 5 attempts"
            exit 1
          else
            echo "⚠️  STAGING_URL secret not configured. Skipping health check."
          fi
