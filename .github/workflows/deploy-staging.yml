name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TODO: Add deployment steps based on hosting provider
      # Examples:
      # - Railway: railway up
      # - Fly.io: flyctl deploy
      # - Render: render deploy
      # - Google Cloud Run: gcloud run deploy

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "TODO: Configure deployment to your hosting provider"
          echo "See workflow file for examples"
