name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image: ${{ steps.build.outputs.imageid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===========================================
      # Configure your production deployment here
      # Use the same provider as staging
      # ===========================================

      - name: Deploy to production
        run: |
          echo "🚀 Deploying ${{ github.ref_name }} to production..."
          echo "Container image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo ""
          echo "⚠️  Production deployment not configured."
          echo "Configure deployment in the workflow file."

  migrate-production:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: |
          echo "🗄️  Running production database migrations..."
          # Uncomment when Drizzle migrations are set up:
          # bun run db:migrate
          echo "⚠️  Database migrations not configured yet."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  health-check-production:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production, migrate-production]
    if: success()
    environment: production
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check health endpoint
        run: |
          if [ -n "${{ secrets.PRODUCTION_URL }}" ]; then
            echo "🏥 Checking health at ${{ secrets.PRODUCTION_URL }}/health..."
            curl -f "${{ secrets.PRODUCTION_URL }}/health" || exit 1
            echo "✅ Production health check passed!"
          else
            echo "⚠️  PRODUCTION_URL secret not configured. Skipping health check."
          fi
