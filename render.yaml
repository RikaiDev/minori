# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  # API Server
  - type: web
    name: minori-api
    runtime: docker
    repo: https://github.com/RikaiDev/minori
    region: singapore # Closest to Taiwan
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CWA_API_KEY
        sync: false
